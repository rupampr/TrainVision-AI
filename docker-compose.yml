services:
  db:
    image: postgres:16-alpine
    container_name: trainvision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trainvision
      POSTGRES_PASSWORD: trainvision
      POSTGRES_DB: trainvision
    ports:
      - "5432:5432"
    volumes:
      - trainvision-pgdata:/var/lib/postgresql/data

volumes:
  trainvision-pgdata: